imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: fr

framework:
    #esi: ~
    translator: { fallbacks: ['%locale%'] }
    secret: '%secret%'
    router:
        resource: '%kernel.root_dir%/config/routing.yml'
        strict_requirements: ~
    form: ~
    csrf_protection: ~
    validation: { enable_annotations: true }
    #serializer: { enable_annotations: true }
    templating:
        engines: ['twig']
    default_locale: '%locale%'
    trusted_hosts: ~
    trusted_proxies: ~
    session:
        # handler_id set to null will use default session handler from php.ini
        handler_id: ~
    fragments: ~
    http_method_override: true

# Twig Configuration
twig:
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'
    form_themes:
        - '@FOSCKEditor/Form/ckeditor_widget.html.twig'

# Assetic Configuration
assetic:
    debug: '%kernel.debug%'
    use_controller: '%kernel.debug%' #false
    bundles:
        - MoocmsBundle
        - UserBundle

    ##java: /usr/bin/java
    filters:
        cssrewrite: ~
        ## closure:
        ##    jar: '%kernel.root_dir%/Resources/java/compiler.jar'
        ## yui_css:
        ##    jar: '%kernel.root_dir%/Resources/java/yuicompressor-2.4.7.jar'

# Doctrine Configuration
doctrine:
    dbal:
        driver: pdo_mysql
        host: '%database_host%'
        port: '%database_port%'
        dbname: '%database_name%'
        user: '%database_user%'
        password: '%database_password%'
        charset: UTF8
        server_version: '10.1'

        mapping_types:
             enum: string

        types:      # For sonataMediaBundle      ICI ICI
            json: Sonata\Doctrine\Types\JsonType

        # if using pdo_sqlite as your database driver:
        #   1. add the path in parameters.yml
        #     e.g. database_path: '%kernel.root_dir%/data/data.db3'
        #   2. Uncomment database_path in parameters.yml.dist
        #   3. Uncomment next line:
        #path: '%database_path%'

    orm:
        auto_generate_proxy_classes: false #'%kernel.debug%'
        entity_managers:      # For sonataMediaBundle
            default:
                naming_strategy: doctrine.orm.naming_strategy.underscore
                auto_mapping: true
                mappings:   #ICI ICI
                    SonataMediaBundle: ~


#Swiftmailer Configuration
swiftmailer:
    transport: '%mailer_transport%'
    host: '%mailer_host%'
    username: '%mailer_user%'
    password: '%mailer_password%'
    spool: { type: memory }


fos_ck_editor:

    base_path: "build/ckeditor"
    js_path:   "build/ckeditor/ckeditor.js"
    
    plugins:
        lineutils:
            path:                       '/ckeditor/plugins/lineutils/'
            filename:                   'plugin.js'
        widget:
            path:                       '/ckeditor/plugins/widget/'
            filename:                   'plugin.js'
        # codesnippet:
        #     path:                       '/ckeditor/plugins/codesnippet/'
        #     filename:                   'plugin.js'

    default_config: default

    configs:

        default:
            extraPlugins: 'lineutils,widget,codesnippet'
            filebrowserUploadMethod: form

        my_config:
            toolbar: standard
            forcePasteAsPlainText: true
            filebrowserBrowseRoute: admin_sonata_media_media_browser #admin_sonata_media_media_ckeditor_browser
            filebrowserImageBrowseRoute: admin_sonata_media_media_browser #admin_sonata_media_media_ckeditor_browser
            # Display images by default when clicking the image dialog browse button
            filebrowserImageBrowseRouteParameters:
                provider: sonata.media.provider.image
            filebrowserUploadRoute: admin_sonata_media_media_upload #admin_sonata_media_media_ckeditor_upload
            filebrowserUploadRouteParameters:
                provider: sonata.media.provider.file
            # Upload file as image when sending a file from the image dialog
            filebrowserImageUploadRoute: admin_sonata_media_media_upload #admin_sonata_media_media_ckeditor_upload
            filebrowserImageUploadRouteParameters:
                provider: sonata.media.provider.image
                context: default # Optional, to upload in a custom context
            filebrowserUploadMethod: form

        new_config:
            toolbar: "new_toolbar"
            height: "600px"
            forcePasteAsPlainText: true
            filebrowserBrowseRoute: admin_sonata_media_media_browser #admin_sonata_media_media_ckeditor_browser
            filebrowserImageBrowseRoute: admin_sonata_media_media_browser #admin_sonata_media_media_ckeditor_browser
            # Display images by default when clicking the image dialog browse button
            filebrowserImageBrowseRouteParameters:
                provider: sonata.media.provider.image
            filebrowserUploadRoute: admin_sonata_media_media_upload #admin_sonata_media_media_ckeditor_upload
            filebrowserUploadRouteParameters:
                provider: sonata.media.provider.file
            # Upload file as image when sending a file from the image dialog
            filebrowserImageUploadRoute: admin_sonata_media_media_upload #admin_sonata_media_media_ckeditor_upload
            filebrowserImageUploadRouteParameters:
                provider: sonata.media.provider.image
                context: default # Optional, to upload in a custom context

            extraPlugins: 'lineutils,widget,codesnippet'
            filebrowserUploadMethod: form

    toolbars:
        configs:
            new_toolbar: [ "@document", "@clipboard", "@links", "@insert", "/", "@basicstyles", "@paragraph" , "/", "@styles", "@colors", "@tool" ]
        items:
            document: [ "Source"]
            clipboard: [ 'Undo', 'Redo','-','Cut', 'Copy', 'Paste', 'PasteText', 'PasteFromWord' ]
            basicstyles: [ 'Bold', 'Italic', 'Underline', 'Strike', 'Subscript', 'Superscript', '-', 'CopyFormatting', 'RemoveFormat' ]
            paragraph: [ 'NumberedList', 'BulletedList', '-', 'Outdent', 'Indent', '-', 'Blockquote', '-', 'JustifyLeft', 'JustifyCenter', 'JustifyRight', 'JustifyBlock' ]
            links:     [ 'Link', 'Unlink' ]
            insert: [ 'Image', 'CodeSnippet' , 'Flash', 'Table', 'HorizontalRule', 'Smiley', 'SpecialChar', 'PageBreak', 'Iframe' ]
            styles: [ 'Styles', 'Format', 'Font', 'FontSize' ]
            colors: [ 'TextColor', 'BGColor' ]
            tool:     [ "Maximize", "ShowBlocks" ]

#Sonata
sonata_core:
    form:
        mapping:
            enabled: false
    form_type: horizontal
#
sonata_media:
    # if you don't use default namespace configuration
    #class:
    #    media:        MyVendor\MediaBundle\Entity\Media
    #    gallery:      MyVendor\MediaBundle\Entity\Gallery
    #    gallery_item: MyVendor\MediaBundle\Entity\GalleryItem
    db_driver: doctrine_orm # or doctrine_mongodb, doctrine_phpcr it is mandatory to choose one here
    default_context: default # you need to set a context
    contexts:
        default:  # the default context is mandatory
            download:
                strategy: sonata.media.security.connected_strategy
                mode: http

            providers:
                # - sonata.media.provider.dailymotion
                # - sonata.media.provider.youtube
                - sonata.media.provider.image
                - sonata.media.provider.file
                # - sonata.media.provider.vimeo

            formats:
                small: { width: 100 , quality: 70}
                big:   { width: 500 , quality: 70}

    cdn:
        server:
            path: /uploads/media # http://media.sonata-project.org/

    filesystem:
        local:
            # directory:  "%kernel.root_dir%/../public/uploads/media" #flex
            directory:  "%kernel.root_dir%/../web/uploads/media" #non-flex
            create:     false
    #Image resizer
    providers:
        image:
            resizer: sonata.media.resizer.square

    class:
        media: Application\Sonata\MediaBundle\Entity\Media
        gallery: Application\Sonata\MediaBundle\Entity\Gallery
        gallery_has_media: Application\Sonata\MediaBundle\Entity\GalleryHasMedia

# config/packages/sonata_admin.yaml
sonata_block:
    default_context: [sonata_page_bundle]
    blocks:
        # enable the SonataAdminBundle block
        sonata.admin.block.admin_list:
            contexts: [admin]

        sonata.block.service.text:
        sonata.block.service.rss:

# config/packages/framework.yaml
framework:
    trusted_proxies: ~
    translator: { fallbacks: ["%locale%"] }

coop_tilleuls_ck_editor_sonata_media:
    templates:
        layout: CoopTilleulsCKEditorSonataMediaBundle::layout.html.twig # Layout of the file browser
        browser: CoopTilleulsCKEditorSonataMediaBundle:MediaAdmin:browser.html.twig # Template of the CKEditor file browser
        upload: CoopTilleulsCKEditorSonataMediaBundle:MediaAdmin:upload.html.twig # Template returned after a direct upload

# FOS USERBUNDLE CONFIG
fos_user:
    db_driver: orm # other valid values are 'mongodb' and 'couchdb'
    firewall_name: main
    user_class: sf_moocms\UserBundle\Entity\User

    from_email:
        address:        noreply@lab3216.com
        sender_name:    Team Support

    registration:
        confirmation:
            enabled: true #false   <- set to false for local use

        form:
            type: sf_moocms\UserBundle\Form\RegistrationType
            # app_user_registration
            # name: app_user_registration

    # service:
    #   token_generator:        fos_user.util.token_generator.default

knp_paginator:
    page_range: 5                       # number of links showed in the pagination menu (e.g: you have 10 pages, a page_range of 3, on the 5th page you'll see links to page 4, 5, 6)
    default_options:
        page_name: page                 # page query parameter name
        sort_field_name: sort           # sort field query parameter name
        sort_direction_name: direction  # sort direction query parameter name
        distinct: true                  # ensure distinct results, useful when ORM queries are using GROUP BY statements
        filter_field_name: filterField  # filter field query parameter name
        filter_value_name: filterValue  # filter value query parameter name
    template:
        pagination: '@KnpPaginator/Pagination/twitter_bootstrap_v4_pagination.html.twig'     # sliding pagination controls template
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig' # sort link template
        filtration: '@KnpPaginator/Pagination/filtration.html.twig'  # filters template

webpack_encore:
    # The path where Encore is building the assets.
    # This should match Encore.setOutputPath() in webpack.config.js.
    output_path: '%kernel.project_dir%/web/build'
    # If multiple builds are defined (as shown below), you can disable the default build:
    # output_path: false